name: Build PS1WiiU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build native Wii U app
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Wii U build compatibility patch
        run: |
          cd vendor/pcsx_rearmed
          git apply ../../patches/pcsx-rearmed-wiiu-pointer-casts.patch

      - name: Build PCSX-ReARMed core for Wii U
        run: make -C vendor/pcsx_rearmed -f Makefile.libretro platform=wiiu

      - name: Configure WUT build
        run: |
          test -n "$DEVKITPRO"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/WiiU.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile RPX and WUHB
        run: cmake --build build --parallel 2

      - name: Package SD-card layout
        run: python3 tools/package_release.py

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: PS1WiiU-SD-${{ github.sha }}
          path: dist/PS1WiiU-SD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Update Nightly release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nightly
          name: Nightly
          body: "Automated development build from the latest main commit. Experimental PS1 emulation frontend; BIOS and game images must be supplied by the user."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/PS1WiiU-SD.zip

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/PS1WiiU-SD.zip
